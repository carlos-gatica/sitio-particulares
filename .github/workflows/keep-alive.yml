name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch:
  # Permite ejecutarlo manualmente desde GitHub también

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -f https://carlos-gatica.vercel.app/health